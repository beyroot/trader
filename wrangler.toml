name = "astra-trader"
compatibility_date = "2026-09-19"

# `wrangler deploy` treats this project as a static-assets Worker. Keeping the
# output directory here makes both Cloudflare Builds and local CLI deployments
# non-interactive and avoids requiring a Worker script entry point.
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
